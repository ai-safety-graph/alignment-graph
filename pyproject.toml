[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aisafety-pipeline"
version = "0.1.0"
description = "Staged arXiv → PostgreSQL → Embeddings → Filter → Clustering → Labeling → Layout → FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Savva Lambin" }]

dependencies = [
  # PostgreSQL + vector search
  "psycopg2-binary>=2.9",
  "pgvector>=0.3",
  # API server
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Harvesting, embeddings, filtering, clustering, and self-hosted semantic
# search (ENABLE_SEMANTIC_SEARCH=true) all need this. Not required to just
# run `aisafety-pipeline serve` against an already-populated database.
pipeline = [
  "numpy==2.2.6",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "requests==2.32.4",
  "umap-learn==0.5.9.post2",
  "transformers==4.51.3",
  "adapters==1.2.0",
  # runtime deps you likely also need:
  # "torch",           # install the correct wheel for your platform/CUDA separately
]
dev = [
  "ruff==0.16.5",
]

[project.scripts]
aisafety-pipeline = "aisafety_pipeline.utils:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/aisafety_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "src/aisafety_pipeline",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["archive", "tmp", "data", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line-too-long: not enforced yet, codebase has pre-existing long lines
  "E701",  # multiple-statements-on-one-line-colon: used deliberately for compact CLI code
  "E702",  # multiple-statements-on-one-line-semicolon: same
  "B008",  # function-call-in-default-argument: FastAPI's `Depends(...)` idiom relies on this
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
