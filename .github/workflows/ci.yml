name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.16.5 check .

  ui:
    name: UI (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # `npm run lint` is intentionally not run here yet: it currently fails
      # on ~29 pre-existing `no-explicit-any` / `no-unused-expressions`
      # errors unrelated to CI setup. Fix those separately, then add it back.
      - run: npm run build
