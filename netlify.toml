[build]
base = "ui"
command = "npm ci && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[redirects]]
from = "/assets/*"
to = "/index.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200